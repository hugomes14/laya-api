services:
  ticket-router:
    build: .
    container_name: laya-ticket-router

    ports:
      - "${PORT:-8080}:8080"

    environment:
      USE_TF: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_NUM_THREADS: "4"
      TORCH_NUM_INTEROP_THREADS: "1"
      LOAD_MODEL: "${LOAD_MODEL:-true}"
      LAYA_MODEL_ID: "${LAYA_MODEL_ID:-convaiinnovations/laya}"
      LAYA_MODEL_SUBFOLDER: "${LAYA_MODEL_SUBFOLDER:-multilingual}"
      LAYA_DEVICE: "cpu"
      MODEL_NAME: "${MODEL_NAME:-laya-multilingual}"
      MODEL_VERSION: "${MODEL_VERSION:-bootstrap}"
      HF_HOME: "/models/huggingface"

    volumes:
      - laya-model-cache:/models/huggingface
      - ./config:/app/config:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  laya-model-cache:
