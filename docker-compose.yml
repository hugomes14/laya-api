services:
  ticket-router:
    build: .
    container_name: laya-ticket-router

    ports:
      - "${PORT:-8080}:8080"

    environment:
      USE_TF: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      MODEL_NAME: "${MODEL_NAME:-laya-multilingual}"
      MODEL_VERSION: "${MODEL_VERSION:-bootstrap}"
      HF_HOME: "/models/huggingface"

    volumes:
      - laya-model-cache:/models/huggingface
      - ./config:/app/config:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  laya-model-cache:
